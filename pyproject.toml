[project]
name = "learn-agent"
version = "0.1.0"
description = "三阶段 Python + LangChain + Agent 手写框架教学项目（练习驱动）"
requires-python = ">=3.11"
dependencies = [
    "any>=0.0.2",
]

[project.optional-dependencies]
# 阶段一后端部分需要的库
stage1 = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "redis>=5.0",
    "alembic>=1.13",
]
# 阶段二需要的库（LangChain 家族）
stage2 = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-community>=0.3",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "tiktoken>=0.7",
]
# 开发工具
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 这台 Windows 机器的 uv 默认缓存目录在原子写文件时报 os error 17，
# 换到工作区所在的 E 盘即可。换机器时把这段删掉或改成自己的路径。
[tool.uv]
cache-dir = "E:/Tmp/uvcache"

[tool.hatch.build.targets.wheel]
packages = ["learnkit", "labs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 题面文件会预先 import 学员马上要用到的名字，未使用属于设计的一部分
"labs/*/lab.py" = ["F401", "F841", "B008", "E731", "UP017"]
"labs/*/solutions.py" = ["B008", "E731", "UP017"]
# 测试文件里需要先 importorskip 再 import，所以 E402 是刻意的
"tests/*" = ["E402", "E731", "B008", "B017", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
